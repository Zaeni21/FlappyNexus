<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Stake NEX</h1>

    <div class="bg-white shadow rounded-lg p-4 mb-6">
      <div class="flex justify-between items-center text-sm">
        <div>
          <p class="text-gray-500">Wallet</p>
          <p id="walletAddress" class="font-mono">-</p>
        </div>
        <div class="space-x-2">
          <span id="walletStatus" class="text-amber-600 font-medium">Privy session required</span>
        </div>
      </div>
      <p id="walletBalance" class="text-sm text-gray-500 mt-1">Balance: -</p>
<div class="text-center text-sm text-gray-500 mb-2">
  APY: <span id="apyValue">-</span>% &bull; Pool: <span id="poolBalance">-</span> NEX
</div>
      <div class="grid grid-cols-2 gap-4 text-center mt-4">
        <div>
          <p class="text-gray-500">Total Staked</p>
          <p id="totalStaked" class="text-lg font-semibold">0.00 NEX</p>
        </div>
        <div>
          <p class="text-gray-500">Pending Rewards</p>
          <p id="pendingRewards" class="text-lg font-semibold">0.00 NEX</p>
        </div>
      </div>
    </div>

    <div id="stakeForm" class="bg-white shadow rounded-lg p-4">
      <label class="block text-sm text-gray-500 mb-1" for="amount">Amount</label>
      <input type="number" id="amount" placeholder="0.0" class="w-full p-2 border rounded mb-3" />
      <input type="range" min="0" max="100" value="0" id="slider" class="w-full mb-1">
      <p id="percentageText" class="text-sm text-right text-gray-500 mb-3">0%</p>

      <div class="grid grid-cols-2 gap-4 mb-3">
        <button id="stakeBtn" onclick="setMode('stake')" class="bg-gray-900 text-white py-2 rounded">Stake</button>
        <button id="unstakeBtn" onclick="setMode('unstake')" class="bg-gray-200 text-gray-800 py-2 rounded">Unstake</button>
      </div>
      <button onclick="confirmAction()" class="w-full bg-blue-600 text-white py-2 rounded">Confirm</button>
      <!-- Tombol yang bisa dilipat -->
<div id="actionButtons" class="grid grid-cols-2 gap-4 mt-4 transition-all duration-300 origin-top">
  <button onclick="claimRewards()" class="bg-gray-200 text-gray-800 text-sm py-1.5 rounded">Claim</button>
  <button onclick="depositRewards()" class="bg-gray-200 text-gray-800 text-sm py-1.5 rounded">Deposit</button>
</div>
	    <!-- Tombol Toggle -->
<div class="text-center mt-2">
  <button onclick="toggleActions()" class="text-sm text-gray-500 hover:text-black">
    Toggle Actions
  </button>
</div>
     </div>

    <p class="text-center text-xs text-gray-400 mt-6">Built by 0xzvan with love for degen culture</p>
  </div>
<script>
  let provider, signer, walletAddress, contract, privyClient;
  let balance = 0, totalStaked = 0;
  let mode = "stake";

  const PRIVY_APP_ID = window.PRIVY_APP_ID || "cmmnuhuc601up0dlbr16yfolt";
  const PRIVY_CLIENT_ID = window.PRIVY_CLIENT_ID || "";

  const contractAddress = "0x5D1a7d8f09c14D21fBC27298C83991c3a6BEA880"; // Nexus
  const abi = [

	{

			{

		],

		"outputs": [],

	{

	{

	{

		"name": "apy",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",

			}
		],

	},
	{

			{

				"name": "user",

			}
		],

		"outputs": [
			{

			}
		],

	{

		],

	},
	{

async function updateUI() {
  const staked = await contract.getStakedAmount(walletAddress);
  const reward = await contract.pendingReward(walletAddress);
  const rawBal = await provider.getBalance(walletAddress);
  
  balance = parseFloat(ethers.utils.formatEther(rawBal));
  totalStaked = parseFloat(ethers.utils.formatEther(staked));

  document.getElementById("walletBalance").textContent = `Balance: ${balance.toFixed(2)} NEX`;
  document.getElementById("totalStaked").textContent = totalStaked.toFixed(2) + " NEX";
  document.getElementById("pendingRewards").textContent = parseFloat(ethers.utils.formatEther(reward)).toFixed(2) + " NEX";
	const apy = await contract.apy();
document.getElementById("apyValue").textContent = apy.toString();

const contractBalance = await provider.getBalance(contractAddress);
document.getElementById("poolBalance").textContent =
  parseFloat(ethers.utils.formatEther(contractBalance)).toFixed(2);
}
  async function initPrivyStakeSession() {
    if (!window.Privy || typeof window.Privy.create !== "function") {
      throw new Error("Privy SDK belum termuat di halaman Stake.");
    }

    if (!PRIVY_APP_ID) {
      throw new Error("PRIVY_APP_ID belum diset.");
    }

    privyClient = privyClient || window.Privy.create({
      appId: PRIVY_APP_ID,
      clientId: PRIVY_CLIENT_ID || undefined
    });

    const user = privyClient.user || (typeof privyClient.getUser === "function" ? await privyClient.getUser() : null);
    const privyAddress = user?.wallet?.address || "";

    if (!privyAddress) {
      throw new Error("Session Privy tidak ditemukan. Login dulu dari landing page.");
    }

    const privyProvider = await privyClient?.wallets?.ethereum?.getProvider?.();
    if (!privyProvider) {
      throw new Error("Provider Privy tidak tersedia. Silakan login ulang dari landing page.");
    }

    provider = new ethers.providers.Web3Provider(privyProvider);
    signer = provider.getSigner();
    const signerAddress = await signer.getAddress();
    walletAddress = signerAddress || privyAddress;
    contract = new ethers.Contract(contractAddress, abi, signer);

    document.getElementById("walletAddress").textContent = `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}`;
    document.getElementById("walletStatus").textContent = "Privy session active";
    document.getElementById("walletStatus").className = "text-green-600 font-medium";

    await updateUI();
    setMode(mode);
  }

  window.addEventListener("load", async () => {
    try {
      await initPrivyStakeSession();
    } catch (error) {
      console.error("[stake] privy init failed", error);
      document.getElementById("walletStatus").textContent = "Privy session unavailable";
      document.getElementById("walletStatus").className = "text-red-600 font-medium";
      document.getElementById("walletAddress").textContent = "Login from landing page";
      document.getElementById("walletBalance").textContent = "Balance: -";
    }
  });

  const slider = document.getElementById("slider");
const amountInput = document.getElementById("amount");
const percentageText = document.getElementById("percentageText");

slider.addEventListener("input", () => {
  const base = mode === "stake" ? balance : totalStaked;
  const val = (parseFloat(slider.value) / 100) * base;
  amountInput.value = val.toFixed(2);
  percentageText.textContent = `${slider.value}%`;
});

amountInput.addEventListener("input", () => {
  const base = mode === "stake" ? balance : totalStaked;
  const val = Math.min(base, parseFloat(amountInput.value) || 0);
  slider.value = ((val / base) * 100).toFixed(0);
  percentageText.textContent = `${slider.value}%`;
});
  async function claimRewards() {
  if (!walletAddress) return alert("Privy session belum aktif. Login dari landing page.");
  try {
    const tx = await contract.claimReward();
    const receipt = await tx.wait();

// TX hash UI
const txBox = document.getElementById("txHashMsg");
const txLink = document.getElementById("txLink");
txLink.href = `https://testnet3.explorer.nexus.xyz/tx/${receipt.transactionHash}`;
txBox.classList.remove("hidden");
setTimeout(() => { txBox.classList.add("hidden"); }, 10000);

    // Tambahkan delay 1 detik sebelum refresh UI
    setTimeout(updateUI, 1000);
  } catch (err) {
    alert("Claim failed: " + err.message);
  }
}

async function depositRewards() {
  const admin = "0x58c5796edc7001b949693cc2655d190db54c271f";
  if (!walletAddress) {
    alert("Privy session belum aktif. Login dari landing page.");
    return;
  }

  if (walletAddress.toLowerCase() !== admin.toLowerCase()) {
    alert("Only admin can deposit rewards.");
    return;
  }

  const input = "10"; // hardcoded

  try {
    const value = ethers.utils.parseEther(input);
    const tx = await contract.depositReward({ value });
    await tx.wait();
    alert("Reward deposited successfully!");
    updateUI();
  } catch (err) {
    console.error(err);
    alert("Deposit failed: " + (err.data?.message || err.message));
  }
}
	setInterval(async () => {
  if (walletAddress && contract) {
    try {
      const reward = await contract.pendingReward(walletAddress);
      document.getElementById("pendingRewards").textContent = parseFloat(ethers.utils.formatEther(reward)).toFixed(4) + " NEX";
    } catch (err) {
      console.error("Failed to update reward:", err);
    }
  }
}, 3000); // update setiap 3 detik
	let actionsVisible = true;

function toggleActions() {
  const box = document.getElementById("actionButtons");

  if (actionsVisible) {
    box.style.transform = "scaleY(0)";
    box.style.height = "0";
    box.style.opacity = "0";
    box.style.overflow = "hidden";
  } else {
    box.style.transform = "scaleY(1)";
    box.style.height = "auto";
    box.style.opacity = "1";
    box.style.overflow = "visible";
  }

  actionsVisible = !actionsVisible;
}
</script>
